
name: Portview Mac 27 + RustDesk + iPhone IPA

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Session duration in hours"
        required: true
        default: "2"
        type: choice
        options: ["1", "2", "3", "4", "5", "6"]

permissions:
  contents: read

jobs:
  build:
    name: Portview on macOS 27
    runs-on: xcode-27
    timeout-minutes: 360

    env:
      SESSION_DURATION: ${{ inputs.duration }}

    steps:
      - name: Connect Tailscale (3-minute limit)
        id: tailscale
        continue-on-error: true
        timeout-minutes: 3
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --accept-dns=false

      - name: Verify Tailscale connection
        shell: bash
        timeout-minutes: 1
        run: |
          set -euo pipefail

          if ! command -v tailscale >/dev/null 2>&1; then
            echo "::error::Tailscale CLI is unavailable after connection step."
            exit 1
          fi

          python3 - <<'PY'
          import subprocess, sys

          try:
              result = subprocess.run(
                  ["tailscale", "status", "--json"],
                  capture_output=True,
                  text=True,
                  timeout=20
              )
              if result.returncode != 0:
                  print(result.stderr or result.stdout)
                  sys.exit("Tailscale status failed.")
              import json
              data = json.loads(result.stdout)
              if data.get("BackendState") != "Running":
                  sys.exit(
                      "Tailscale is not Running: "
                      + str(data.get("BackendState"))
                  )
              print("Tailscale backend is Running.")
              print("This confirms local status, not reachability to every device.")
          except subprocess.TimeoutExpired:
              sys.exit("Tailscale status timed out after 20 seconds.")
          PY

      - name: Checkout Portview
        uses: actions/checkout@v4
        with:
          repository: TaylorFinklea/portview
          ref: main
          path: portview

      - name: Install build tools and RustDesk
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail

          command -v xcodebuild
          xcodebuild -version

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          if [ ! -d "/Applications/RustDesk.app" ]; then
            brew install --cask rustdesk
          fi

          mkdir -p "$HOME/Desktop/PortviewBuild"
          open -a RustDesk || true
          sleep 10

      - name: Configure RustDesk and save connection info
        shell: bash
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          set -euo pipefail

          RUSTDESK_BIN="/Applications/RustDesk.app/Contents/MacOS/rustdesk"

          if [ -z "${RUSTDESK_PASSWORD:-}" ]; then
            echo "::error::Add RUSTDESK_PASSWORD under GitHub Actions secrets."
            exit 1
          fi

          "$RUSTDESK_BIN" --password "$RUSTDESK_PASSWORD" || {
            echo "::error::RustDesk password setup failed; inspect RustDesk on the runner."
            exit 1
          }

          sleep 5

          RUSTDESK_ID="$("$RUSTDESK_BIN" --get-id 2>/dev/null || true)"
          TS_IP="$(tailscale ip -4 2>/dev/null | head -1 || true)"

          if [ -z "$RUSTDESK_ID" ]; then
            echo "::error::RustDesk ID could not be retrieved."
            exit 1
          fi

          {
            echo "RustDesk ID: $RUSTDESK_ID"
            echo "Tailscale IP: ${TS_IP:-Unavailable}"
            echo "RustDesk password: stored in GitHub Secret RUSTDESK_PASSWORD"
          } > "$HOME/Desktop/PortviewBuild/connection-info.txt"

          chmod 600 "$HOME/Desktop/PortviewBuild/connection-info.txt"

          echo "RustDesk ID retrieved."
          echo "Tailscale IP: ${TS_IP:-Unavailable}"

      - name: Generate Xcode projects
        shell: bash
        working-directory: portview
        run: |
          set -euo pipefail
          (cd apps/PortviewHost && xcodegen generate)
          (cd apps/PortviewClient && xcodegen generate)

      - name: Build Mac Host
        shell: bash
        working-directory: portview
        timeout-minutes: 30
        run: |
          set -euo pipefail

          xcodebuild \
            -project apps/PortviewHost/PortviewHost.xcodeproj \
            -scheme PortviewHost \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/HostBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP="$RUNNER_TEMP/HostBuild/Build/Products/Debug/PortviewHost.app"
          test -d "$APP"

          codesign --force --deep --sign - "$APP"

          mkdir -p "$HOME/Desktop"
          ditto "$APP" "$HOME/Desktop/Portview Host.app"

          open "$HOME/Desktop/Portview Host.app" || true

          echo "Mac Host built. GUI permissions may still require manual approval."

      - name: Build unsigned iPhone app
        shell: bash
        working-directory: portview
        timeout-minutes: 40
        run: |
          set -euo pipefail

          # Remove upstream account-specific capabilities from this
          # temporary checkout only; this does not modify your repository.
          ENT="apps/PortviewClient/PortviewClient.entitlements"

          if [ -f "$ENT" ]; then
            /usr/libexec/PlistBuddy \
              -c "Delete :aps-environment" "$ENT" 2>/dev/null || true

            /usr/libexec/PlistBuddy \
              -c "Delete :com.apple.developer.icloud-container-identifiers" \
              "$ENT" 2>/dev/null || true

            /usr/libexec/PlistBuddy \
              -c "Delete :com.apple.developer.icloud-services" \
              "$ENT" 2>/dev/null || true
          fi

          xcodebuild \
            -project apps/PortviewClient/PortviewClient.xcodeproj \
            -scheme PortviewClient \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/iOSBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP="$RUNNER_TEMP/iOSBuild/Build/Products/Release-iphoneos/Portview.app"

          if [ ! -d "$APP" ]; then
            echo "::error::Expected Portview.app was not found. Inspect the Xcode build log."
            find "$RUNNER_TEMP/iOSBuild/Build/Products" -maxdepth 4 -name '*.app' -print
            exit 1
          fi

          OUT="$RUNNER_TEMP/ipa"
          mkdir -p "$OUT/Payload"
          ditto "$APP" "$OUT/Payload/Portview.app"

          cd "$OUT"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            Payload "$HOME/Desktop/Portview.ipa"

          test -s "$HOME/Desktop/Portview.ipa"
          echo "Unsigned IPA package created."

      - name: Upload build files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Portview-macOS27-${{ github.run_id }}
          path: |
            ~/Desktop/Portview.ipa
            ~/Desktop/Portview Host.app
            ~/Desktop/PortviewBuild/connection-info.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Keep session alive
        if: success()
        shell: bash
        run: |
          echo "Keeping runner alive for ${SESSION_DURATION} hour(s)."
          sleep "$((SESSION_DURATION * 3600))"
