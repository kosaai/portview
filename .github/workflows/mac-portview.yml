
name: Portview Mac 27 + RustDesk + iPhone IPA

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Session duration in hours"
        required: true
        default: "2"
        type: choice
        options: ["1", "2", "3", "4", "5", "6"]

permissions:
  contents: read

jobs:
  build:
    name: Portview on macOS 27
    runs-on: xcode-27
    timeout-minutes: 360

    env:
      SESSION_DURATION: ${{ inputs.duration }}

    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --accept-dns=false

      - name: Verify DNS and GitHub access
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail

          echo "Checking GitHub DNS..."
          DNS_OK=0

          for i in {1..6}; do
            if dscacheutil -q host -a name github.com | grep -q 'ip_address'; then
              DNS_OK=1
              break
            fi
            sleep 5
          done

          if [ "$DNS_OK" -ne 1 ]; then
            echo "::error::Cannot resolve github.com"
            scutil --dns || true
            exit 1
          fi

          echo "Checking GitHub HTTPS..."
          curl --connect-timeout 10 --max-time 20 -fsSI https://github.com/ >/dev/null
          echo "GitHub DNS and HTTPS are working."

      - name: Checkout Portview source
        uses: actions/checkout@v4
        with:
          repository: TaylorFinklea/portview
          ref: main
          path: portview

      - name: Install tools and RustDesk
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail

          xcodebuild -version

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          if [ ! -d "/Applications/RustDesk.app" ]; then
            brew install --cask rustdesk
          fi

          mkdir -p "$HOME/Desktop/PortviewBuild"
          open -a RustDesk || true
          sleep 10

      - name: Configure RustDesk
        shell: bash
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          set -euo pipefail

          RUSTDESK_BIN="/Applications/RustDesk.app/Contents/MacOS/rustdesk"

          if [ -z "${RUSTDESK_PASSWORD:-}" ]; then
            echo "::error::Add RUSTDESK_PASSWORD in GitHub Actions Secrets."
            exit 1
          fi

          "$RUSTDESK_BIN" --password "$RUSTDESK_PASSWORD"

          sleep 5
          RUSTDESK_ID="$("$RUSTDESK_BIN" --get-id 2>/dev/null || true)"
          TS_IP="$(tailscale ip -4 2>/dev/null | head -1 || true)"

          if [ -z "$RUSTDESK_ID" ]; then
            echo "::error::Could not retrieve RustDesk ID."
            exit 1
          fi

          {
            echo "RustDesk ID: $RUSTDESK_ID"
            echo "Tailscale IP: ${TS_IP:-Unavailable}"
            echo "RustDesk password: use GitHub Secret RUSTDESK_PASSWORD"
          } > "$HOME/Desktop/PortviewBuild/connection-info.txt"

          chmod 600 "$HOME/Desktop/PortviewBuild/connection-info.txt"
          echo "RustDesk ID: $RUSTDESK_ID"
          echo "Tailscale IP: ${TS_IP:-Unavailable}"

      - name: Generate Xcode projects
        shell: bash
        working-directory: portview
        run: |
          set -euo pipefail
          (cd apps/PortviewHost && xcodegen generate)
          (cd apps/PortviewClient && xcodegen generate)

      - name: Build Mac Host
        shell: bash
        working-directory: portview
        timeout-minutes: 40
        run: |
          set -euo pipefail

          xcodebuild \
            -project apps/PortviewHost/PortviewHost.xcodeproj \
            -scheme PortviewHost \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/HostBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP="$RUNNER_TEMP/HostBuild/Build/Products/Debug/PortviewHost.app"
          test -d "$APP"

          mkdir -p "$HOME/Desktop"
          ditto "$APP" "$HOME/Desktop/Portview Host.app"

          open "$HOME/Desktop/Portview Host.app" || true
          echo "Mac Host build completed."

      - name: Build unsigned iPhone IPA
        shell: bash
        working-directory: portview
        timeout-minutes: 45
        run: |
          set -euo pipefail

          ENT="apps/PortviewClient/PortviewClient.entitlements"

          # Remove upstream account-specific capabilities from this
          # temporary checkout only.
          if [ -f "$ENT" ]; then
            /usr/libexec/PlistBuddy \
              -c "Delete :aps-environment" "$ENT" 2>/dev/null || true

            /usr/libexec/PlistBuddy \
              -c "Delete :com.apple.developer.icloud-container-identifiers" \
              "$ENT" 2>/dev/null || true

            /usr/libexec/PlistBuddy \
              -c "Delete :com.apple.developer.icloud-services" \
              "$ENT" 2>/dev/null || true
          fi

          xcodebuild \
            -project apps/PortviewClient/PortviewClient.xcodeproj \
            -scheme PortviewClient \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/iOSBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP="$RUNNER_TEMP/iOSBuild/Build/Products/Release-iphoneos/Portview.app"

          if [ ! -d "$APP" ]; then
            echo "::error::Portview.app not found after build."
            find "$RUNNER_TEMP/iOSBuild/Build/Products" \
              -maxdepth 5 -name '*.app' -print
            exit 1
          fi

          OUT="$RUNNER_TEMP/ipa"
          mkdir -p "$OUT/Payload"
          ditto "$APP" "$OUT/Payload/Portview.app"

          cd "$OUT"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            Payload "$HOME/Desktop/Portview.ipa"

          test -s "$HOME/Desktop/Portview.ipa"
          echo "IPA package created."

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Portview-macOS27-${{ github.run_id }}
          path: |
            /Users/runner/Desktop/Portview.ipa
            /Users/runner/Desktop/Portview Host.app
            /Users/runner/Desktop/PortviewBuild/connection-info.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Keep session alive
        if: success()
        shell: bash
        run: |
          echo "Keeping session alive for ${SESSION_DURATION} hour(s)."
          sleep "$((SESSION_DURATION * 3600))"
