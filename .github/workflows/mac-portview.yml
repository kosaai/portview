
name: Portview Mac 27 + RustDesk + iPhone IPA

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Session duration in hours"
        required: true
        default: "2"
        type: choice
        options: ["1", "2", "3", "4", "5", "6"]

permissions:
  contents: read

jobs:
  build:
    name: Portview on macOS 27
    runs-on: xcode-27
    timeout-minutes: 360

    env:
      SESSION_DURATION: ${{ inputs.duration }}

    steps:
      # 1. Download source BEFORE connecting Tailscale
      - name: Checkout Portview source
        uses: actions/checkout@v4
        with:
          repository: TaylorFinklea/portview
          ref: main
          path: portview

      - name: Install tools and RustDesk
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail

          xcodebuild -version
          brew install xcodegen

          if [ ! -d "/Applications/RustDesk.app" ]; then
            brew install --cask rustdesk
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

      - name: Generate Xcode projects
        shell: bash
        working-directory: portview
        run: |
          set -euo pipefail
          (cd apps/PortviewHost && xcodegen generate)
          (cd apps/PortviewClient && xcodegen generate)

      - name: Build Mac Host
        shell: bash
        working-directory: portview
        timeout-minutes: 45
        run: |
          set -euo pipefail

          xcodebuild \
            -project apps/PortviewHost/PortviewHost.xcodeproj \
            -scheme PortviewHost \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/HostBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build

          # The host app lands in the HostBuild derived data, under Debug
          # (the build above is -configuration Debug). The iOS client is built
          # in the next step into a different derived data path.
          APP="$RUNNER_TEMP/HostBuild/Build/Products/Debug/PortviewHost.app"
          if [ ! -d "$APP" ]; then
            echo "::error::PortviewHost.app was not found."
            find "$RUNNER_TEMP/HostBuild/Build/Products" \
              -maxdepth 5 -name '*.app' -print
            exit 1
          fi

          ditto "$APP" "$GITHUB_WORKSPACE/output/Portview Host.app"
          echo "Mac Host build completed."

      - name: Build unsigned iPhone IPA
        shell: bash
        working-directory: portview
        timeout-minutes: 45
        run: |
          set -euo pipefail

          # Absolute path: the step later does `cd` into the packaging dir, and
          # a relative path in the restore trap would then miss.
          ENT="$GITHUB_WORKSPACE/portview/apps/PortviewClient/PortviewClient.entitlements"
          ENT_BACKUP="$(mktemp)"

          if [ -f "$ENT" ]; then
            cp "$ENT" "$ENT_BACKUP"

            # aps-environment and the iCloud container are account-gated: they
            # need a provisioning profile, which this unsigned CI build has no
            # way to mint. Drop them so the Release build can proceed without
            # signing, then restore the tracked file.
            /usr/libexec/PlistBuddy \
              -c "Delete :aps-environment" "$ENT" 2>/dev/null || true

            /usr/libexec/PlistBuddy \
              -c "Delete :com.apple.developer.icloud-container-identifiers" \
              "$ENT" 2>/dev/null || true

            /usr/libexec/PlistBuddy \
              -c "Delete :com.apple.developer.icloud-services" \
              "$ENT" 2>/dev/null || true
          fi

          cleanup_ent() {
            if [ -f "$ENT_BACKUP" ]; then
              mv -f "$ENT_BACKUP" "$ENT"
            fi
          }
          trap cleanup_ent EXIT

          xcodebuild \
            -project apps/PortviewClient/PortviewClient.xcodeproj \
            -scheme PortviewClient \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/iOSBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build

          # The client target is named PortviewClient, so that is the bundle
          # that lands in Release-iphoneos. Locate it rather than hardcoding a
          # name that may not match the target.
          APP="$(find "$RUNNER_TEMP/iOSBuild/Build/Products/Release-iphoneos" \
            -maxdepth 1 -name '*.app' -print -quit 2>/dev/null || true)"

          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::iOS .app was not found."
            find "$RUNNER_TEMP/iOSBuild/Build/Products" \
              -maxdepth 5 -name '*.app' -print
            exit 1
          fi

          echo "Found iOS app: $APP"

          PACKAGE="$RUNNER_TEMP/ipa"
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE/Payload"

          # Rename to a stable bundle name for the IPA.
          ditto "$APP" "$PACKAGE/Payload/Portview.app"

          cd "$PACKAGE"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            Payload "$GITHUB_WORKSPACE/output/Portview.ipa"

          test -s "$GITHUB_WORKSPACE/output/Portview.ipa"
          echo "Unsigned IPA package created."

      # 2. Upload artifacts BEFORE connecting Tailscale
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Portview-build-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 1

      # 3. Connect only after downloads, builds and upload are finished
      - name: Connect Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --accept-dns=false

      - name: Configure RustDesk and show connection details
        if: steps.tailscale.outcome == 'success'
        shell: bash
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${RUSTDESK_PASSWORD:-}" ]; then
            echo "::error::Add RUSTDESK_PASSWORD to GitHub Actions Secrets."
            exit 1
          fi

          open -a RustDesk || true
          sleep 10

          RUSTDESK_BIN="/Applications/RustDesk.app/Contents/MacOS/rustdesk"
          "$RUSTDESK_BIN" --password "$RUSTDESK_PASSWORD"
          sleep 5

          RUSTDESK_ID=""
          for i in {1..6}; do
            RUSTDESK_ID="$("$RUSTDESK_BIN" --get-id 2>/dev/null || true)"
            [ -n "$RUSTDESK_ID" ] && break
            sleep 5
          done

          TS_IP="$(tailscale ip -4 2>/dev/null | head -1 || true)"

          echo "=================================="
          echo "RustDesk ID: ${RUSTDESK_ID:-Unavailable}"
          echo "Tailscale IP: ${TS_IP:-Unavailable}"
          echo "Use your RUSTDESK_PASSWORD secret as the password."
          echo "=================================="

          if [ -z "$RUSTDESK_ID" ]; then
            echo "::warning::RustDesk ID could not be retrieved."
          fi

          open "$GITHUB_WORKSPACE/output/Portview Host.app" || true

      - name: Keep session alive
        if: steps.tailscale.outcome == 'success'
        shell: bash
        run: |
          echo "Session will remain active for ${SESSION_DURATION} hour(s)."
          sleep "$((SESSION_DURATION * 3600))"
